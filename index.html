<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hashira-o7 — Guild Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="starfield"></div>
  <div class="scanline"></div>
  <div id="root"></div>

  <!-- Core libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <!-- Config (plain JS, must load first) -->
  <script src="js/config.js"></script>

  <!-- Data management: one file per backend query, mirrors the Apps Script split -->
  <script src="js/api/auth.js"></script>
  <script src="js/api/getItems.js"></script>
  <script src="js/api/addItems.js"></script>
  <script src="js/api/deleteItem.js"></script>

  <!-- UI components (JSX, transformed in-browser by Babel) -->
  <script type="text/babel" src="js/ui/Header.js"></script>
  <script type="text/babel" src="js/ui/LoadingScreen.js"></script>
  <script type="text/babel" src="js/ui/ErrorScreen.js"></script>
  <script type="text/babel" src="js/ui/LoginScreen.js"></script>
  <script type="text/babel" src="js/ui/UserBar.js"></script>
  <script type="text/babel" src="js/ui/NavTabs.js"></script>
  <script type="text/babel" src="js/ui/InventoryTab.js"></script>
  <script type="text/babel" src="js/ui/SubmitTab.js"></script>
  <script type="text/babel" src="js/ui/MyItemsTab.js"></script>

  <!-- Main app + mount (must load last) -->
  <script type="text/babel" src="js/App.js"></script>
  <script type="text/babel" src="js/main.js"></script>
</body>
</html>
