<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hashira-o7 — Guild Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #080b12;
      --bg-panel: #0d1117;
      --bg-card: #131820;
      --bg-card-hover: #1a2130;
      --border-dim: rgba(56, 189, 248, 0.08);
      --border-glow: rgba(56, 189, 248, 0.25);
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.15);
      --accent-bright: #7dd3fc;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-dim: #64748b;
      --cat-components: #38bdf8;
      --cat-fps: #f87171;
      --cat-mining: #fbbf24;
      --cat-commodities: #34d399;
      --cat-other: #a78bfa;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .starfield {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .starfield::before {
      content: '';
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 15%, rgba(56,189,248,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.2) 0%, transparent 100%);
      animation: drift 120s linear infinite;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-10%, -10%); }
    }

    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(56, 189, 248, 0.015) 2px,
        rgba(56, 189, 248, 0.015) 4px
      );
    }

    .app {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 40px 20px 30px;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .subtitle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .header .org-name {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin-top: 4px;
      opacity: 0.7;
    }

    .user-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border-glow);
    }
    .admin-badge {
      font-family: var(--font-display);
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 3px 10px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: var(--warning);
    }
    .role-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .btn {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border-glow);
      background: var(--accent-dim);
      color: var(--accent-bright);
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-danger {
      border-color: rgba(248, 113, 113, 0.3);
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.2); }
    .btn-small { padding: 6px 16px; font-size: 0.65rem; }
    .btn-discord {
      background: rgba(88, 101, 242, 0.2);
      border-color: rgba(88, 101, 242, 0.4);
      color: #8b9bf7;
      font-size: 0.85rem;
      padding: 14px 32px;
    }
    .btn-discord:hover {
      background: rgba(88, 101, 242, 0.35);
      border-color: rgba(88, 101, 242, 0.6);
      box-shadow: 0 0 30px rgba(88, 101, 242, 0.2);
    }

    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 30px;
      text-align: center;
    }
    .login-screen .lock-icon { font-size: 3rem; opacity: 0.3; }
    .login-screen p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 400px;
      line-height: 1.6;
    }

    .error-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 20px;
      text-align: center;
    }
    .error-screen .error-icon { font-size: 3rem; }
    .error-screen h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--danger);
    }
    .error-screen p {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 450px;
      line-height: 1.6;
    }

    .nav-tabs {
      display: flex;
      gap: 2px;
      margin: 24px 0 20px;
      border-bottom: 1px solid var(--border-dim);
    }
    .nav-tab {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      position: relative;
      transition: color 0.3s;
    }
    .nav-tab:hover { color: var(--text-secondary); }
    .nav-tab.active { color: var(--accent); }
    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      padding: 16px;
      text-align: center;
    }
    .stat-card .stat-value {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .stat-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 4px;
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .cat-filter {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 16px;
      border: 1px solid var(--border-dim);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-filter:hover { border-color: var(--border-glow); color: var(--text-secondary); }
    .cat-filter.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .cat-filter .cat-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      padding: 20px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .item-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
    }
    .item-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .item-card[data-cat="Ship Components"]::before { background: var(--cat-components); }
    .item-card[data-cat="FPS Weapons & Armor"]::before { background: var(--cat-fps); }
    .item-card[data-cat="Mining/Salvage Materials"]::before { background: var(--cat-mining); }
    .item-card[data-cat="Commodities & Trade Goods"]::before { background: var(--cat-commodities); }
    .item-card[data-cat="Other"]::before { background: var(--cat-other); }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .item-name {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }
    .item-qty {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
      white-space: nowrap;
      padding: 2px 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(56, 189, 248, 0.1);
    }
    .item-category {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .item-notes {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-dim);
    }
    .item-contributor {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .item-date {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .item-admin-delete {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(248, 113, 113, 0.1);
      display: flex;
      justify-content: flex-end;
    }

    .form-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      padding: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-panel h2 {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-dim);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 12px 16px;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .form-group select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2364748b' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-actions { display: flex; gap: 12px; margin-top: 24px; }
    .form-success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--success);
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 1rem; max-width: 360px; margin: 0 auto; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .my-items-table { width: 100%; border-collapse: collapse; }
    .my-items-table th {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-align: left;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-dim);
    }
    .my-items-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-dim);
      font-size: 0.95rem;
    }
    .my-items-table tr:hover td { background: var(--bg-card-hover); }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .form-row { grid-template-columns: 1fr; }
      .item-grid { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .nav-tab { padding: 10px 14px; font-size: 0.6rem; }
      .form-panel { padding: 20px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
  </style>
</head>
<body>
  <div class="starfield"></div>
  <div class="scanline"></div>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ═══════════════════════════════════════════════════════
    // CONFIGURATION — Update these for your deployment
    // ═══════════════════════════════════════════════════════
    const CONFIG = {
      // Google Apps Script web app URL (after deploying)
      APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzuS3o_TVuOndmPMUc9o2He5RtZuZ8gQPkPTUV7g5gK32wb8TEQf5gTidMP7EL36UEQ/exec',

      // Discord OAuth — Client ID only (secret stays on backend)
      DISCORD_CLIENT_ID: '1533142397758734356',
      DISCORD_REDIRECT_URI: 'https://sean-waitkus.github.io/hashira-bank/',

      // Your org name
      ORG_NAME: 'Hashira-o7',

      // Item categories
      CATEGORIES: [
        'Ship Components',
        'FPS Weapons & Armor',
        'Mining/Salvage Materials',
        'Commodities & Trade Goods',
        'Other'
      ],

      CATEGORY_COLORS: {
        'Ship Components': '#38bdf8',
        'FPS Weapons & Armor': '#f87171',
        'Mining/Salvage Materials': '#fbbf24',
        'Commodities & Trade Goods': '#34d399',
        'Other': '#a78bfa'
      }
    };

    // ═══════════════════════════════════════════════════════
    // Discord OAuth — Authorization Code Flow
    // ═══════════════════════════════════════════════════════
    function getDiscordAuthUrl() {
      const params = new URLSearchParams({
        client_id: CONFIG.DISCORD_CLIENT_ID,
        redirect_uri: CONFIG.DISCORD_REDIRECT_URI,
        response_type: 'code',  // Authorization code flow (not implicit)
        scope: 'identify'
      });
      return `https://discord.com/api/oauth2/authorize?${params}`;
    }

    // Extract ?code= from URL after Discord redirect
    function getAuthCode() {
      const params = new URLSearchParams(window.location.search);
      return params.get('code');
    }

    // Exchange the code via our Apps Script backend
    async function authenticateWithCode(code) {
      const url = `${CONFIG.APPS_SCRIPT_URL}?action=auth&code=${encodeURIComponent(code)}`;
      const res = await fetch(url);
      return res.json();
    }

    // ═══════════════════════════════════════════════════════
    // Main App Component
    // ═══════════════════════════════════════════════════════
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState(null);
      const [tab, setTab] = useState('inventory');
      const [items, setItems] = useState([]);
      const [itemsLoading, setItemsLoading] = useState(false);
      const [filterCategory, setFilterCategory] = useState('All');
      const emptyItemRow = () => ({
        itemName: '', category: CONFIG.CATEGORIES[0], quantity: 1, notes: '', inGameName: ''
      });
      const [batchItems, setBatchItems] = useState([emptyItemRow()]);
      const [formStatus, setFormStatus] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      // ── Auth Flow ──
      useEffect(() => {
        const code = getAuthCode();

        if (code) {
          // Clean the URL (remove ?code=)
          window.history.replaceState(null, '', window.location.pathname);

          // Exchange code with backend
          authenticateWithCode(code)
            .then(result => {
              if (result.success) {
                setUser(result.user);
                sessionStorage.setItem('guild_user', JSON.stringify(result.user));
              } else {
                setAuthError(result);
              }
              setLoading(false);
            })
            .catch(err => {
              setAuthError({ error: 'NETWORK_ERROR', message: 'Failed to connect to the server. Please try again.' });
              setLoading(false);
            });
        } else {
          // Check for existing session
          const stored = sessionStorage.getItem('guild_user');
          if (stored) {
            setUser(JSON.parse(stored));
          }
          setLoading(false);
        }
      }, []);

      // ── Fetch Items ──
      const fetchItems = useCallback(async () => {
        setItemsLoading(true);
        try {
          const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getItems&userId=${user.id}`);
          const data = await res.json();
          if (data.error === 'ACCESS_DENIED') {
            setAuthError({ error: 'ACCESS_REVOKED', message: 'Your access has been revoked. Your server role may have changed.' });
            setUser(null);
            sessionStorage.removeItem('guild_user');
          } else if (data.error === 'RATE_LIMITED') {
            console.warn('Rate limited — try refreshing in a moment.');
          } else {
            setItems(data.items || []);
          }
        } catch (e) {
          console.error('Failed to fetch items:', e);
        }
        setItemsLoading(false);
      }, [user]);

      useEffect(() => {
        if (user) fetchItems();
      }, [user, fetchItems]);

      // ── Submit Item ──
      const updateBatchRow = (index, field, value) => {
        setBatchItems(prev => prev.map((row, i) => i === index ? { ...row, [field]: value } : row));
      };

      const addBatchRow = () => {
        setBatchItems(prev => [...prev, emptyItemRow()]);
      };

      const removeBatchRow = (index) => {
        setBatchItems(prev => prev.length === 1 ? prev : prev.filter((_, i) => i !== index));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const validRows = batchItems.filter(row => row.itemName.trim());
        if (validRows.length === 0) return;

        setFormStatus('submitting');

        try {
          const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'addItems',
              items: validRows,
              contributor: user.displayName || user.username,
              userId: user.id
            })
          });
          const result = await res.json();
          if (result.success) {
            setBatchItems([emptyItemRow()]);
            setFormStatus('success');
            fetchItems();
            setTimeout(() => setFormStatus(null), 3000);
          } else if (result.error === 'ACCESS_DENIED') {
            setFormStatus('denied');
          } else if (result.error === 'RATE_LIMITED') {
            setFormStatus('ratelimited');
            setTimeout(() => setFormStatus(null), 4000);
          } else {
            setFormStatus('error');
            setTimeout(() => setFormStatus(null), 3000);
          }
        } catch (e) {
          setFormStatus('error');
          setTimeout(() => setFormStatus(null), 3000);
        }
      };

      // ── Delete Item ──
      const handleDelete = async (itemId) => {
        try {
          const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'deleteItem', id: itemId, userId: user.id })
          });
          const result = await res.json();
          if (result.success) {
            fetchItems();
          } else if (result.error === 'FORBIDDEN') {
            alert(result.message);
          }
        } catch (e) {
          console.error('Delete error:', e);
        }
      };

      const logout = () => {
        sessionStorage.removeItem('guild_user');
        setUser(null);
        setAuthError(null);
      };

      // Filters
      const filteredItems = items.filter(item => {
        const matchesCat = filterCategory === 'All' || item.category === filterCategory;
        const matchesSearch = !searchQuery ||
          item.itemName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.notes?.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.contributor?.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.inGameName?.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const myItems = items.filter(i => i.contributorId === user?.id);

      const catCounts = CONFIG.CATEGORIES.reduce((acc, cat) => {
        acc[cat] = items.filter(i => i.category === cat).length;
        return acc;
      }, {});

      // ── Loading ──
      if (loading) {
        return (
          <div className="app">
            <div className="header">
              <h1>Hashira-o7</h1>
              <div className="subtitle">Guild Bank</div>
              <div className="org-name">Star Citizen</div>
            </div>
            <div className="loading"><div className="spinner"></div>Authenticating with Discord...</div>
          </div>
        );
      }

      // ── Auth Error States ──
      if (authError) {
        let icon = '🚫';
        let title = 'Access Denied';
        let message = authError.message || authError.error || 'An unknown error occurred.';

        if (authError.error === 'NOT_IN_SERVER') {
          icon = '🔗';
          title = 'Not a Server Member';
        } else if (authError.error === 'INSUFFICIENT_ROLE') {
          icon = '🛡️';
          title = 'Missing Required Role';
        } else if (authError.error === 'RATE_LIMITED') {
          icon = '⏳';
          title = 'Slow Down';
          message = message || 'Too many login attempts right now. Please wait a moment and try again.';
        }

        return (
          <div className="app">
            <div className="header">
              <h1>Hashira-o7</h1>
              <div className="subtitle">Guild Bank</div>
              <div className="org-name">Star Citizen</div>
            </div>
            <div className="error-screen fade-in">
              <div className="error-icon">{icon}</div>
              <h2>{title}</h2>
              <p>{message}</p>
              <button className="btn" onClick={() => { setAuthError(null); }}>
                Try Again
              </button>
            </div>
          </div>
        );
      }

      // ── Login Screen ──
      if (!user) {
        return (
          <div className="app">
            <div className="header">
              <h1>Hashira-o7</h1>
              <div className="subtitle">Guild Bank</div>
              <div className="org-name">Star Citizen</div>
            </div>
            <div className="login-screen fade-in">
              <div className="lock-icon">🔒</div>
              <p>Sign in with Discord to access the Hashira-o7 guild bank. You must be a member of the org's Discord server with the required role.</p>
              <button className="btn btn-discord" onClick={() => window.location.href = getDiscordAuthUrl()}>
                ⬡ Sign in with Discord
              </button>
            </div>
          </div>
        );
      }

      // ── Authenticated App ──
      return (
        <div className="app">
          <div className="header">
            <h1>Hashira-o7</h1>
            <div className="subtitle">Guild Bank</div>
            <div className="org-name">Star Citizen</div>
          </div>

          <div className="user-bar">
            <div className="user-info">
              {user.avatar && (
                <img
                  className="user-avatar"
                  src={`https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`}
                  alt=""
                />
              )}
              <span>{user.displayName || user.username}</span>
              {user.isAdmin && <span className="admin-badge">Admin</span>}
              {!user.isAdmin && <span className="role-badge">Member</span>}
            </div>
            <button className="btn btn-small btn-danger" onClick={logout}>Logout</button>
          </div>

          {/* Navigation */}
          <div className="nav-tabs">
            <button className={`nav-tab ${tab === 'inventory' ? 'active' : ''}`} onClick={() => setTab('inventory')}>
              Inventory
            </button>
            <button className={`nav-tab ${tab === 'submit' ? 'active' : ''}`} onClick={() => setTab('submit')}>
              Submit Item
            </button>
            <button className={`nav-tab ${tab === 'myitems' ? 'active' : ''}`} onClick={() => setTab('myitems')}>
              My Items
            </button>
          </div>

          {/* ── Inventory Tab ── */}
          {tab === 'inventory' && (
            <div className="fade-in">
              <div className="stats-bar">
                <div className="stat-card">
                  <div className="stat-value">{items.length}</div>
                  <div className="stat-label">Total Listings</div>
                </div>
                <div className="stat-card">
                  <div className="stat-value">{items.reduce((sum, i) => sum + Number(i.quantity), 0)}</div>
                  <div className="stat-label">Total Items</div>
                </div>
                <div className="stat-card">
                  <div className="stat-value">{new Set(items.map(i => i.contributor)).size}</div>
                  <div className="stat-label">Contributors</div>
                </div>
                <div className="stat-card">
                  <div className="stat-value">{CONFIG.CATEGORIES.length}</div>
                  <div className="stat-label">Categories</div>
                </div>
              </div>

              <div className="form-group" style={{ marginBottom: 16 }}>
                <input
                  type="text"
                  placeholder="Search items, notes, or contributors..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  style={{ maxWidth: 400 }}
                />
              </div>

              <div className="category-filters">
                <button
                  className={`cat-filter ${filterCategory === 'All' ? 'active' : ''}`}
                  onClick={() => setFilterCategory('All')}
                >
                  All ({items.length})
                </button>
                {CONFIG.CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    className={`cat-filter ${filterCategory === cat ? 'active' : ''}`}
                    onClick={() => setFilterCategory(cat)}
                  >
                    <span className="cat-dot" style={{ backgroundColor: CONFIG.CATEGORY_COLORS[cat] }}></span>
                    {cat} ({catCounts[cat] || 0})
                  </button>
                ))}
              </div>

              {itemsLoading ? (
                <div className="loading"><div className="spinner"></div>Loading inventory...</div>
              ) : filteredItems.length === 0 ? (
                <div className="empty-state">
                  <div className="empty-icon">📦</div>
                  <p>No items found. Be the first to contribute to the guild bank!</p>
                </div>
              ) : (
                <div className="item-grid">
                  {filteredItems.map(item => (
                    <div key={item.id} className="item-card" data-cat={item.category}>
                      <div className="item-header">
                        <div className="item-name">{item.itemName}</div>
                        <div className="item-qty">×{item.quantity}</div>
                      </div>
                      <div className="item-category" style={{ color: CONFIG.CATEGORY_COLORS[item.category] }}>
                        {item.category}
                      </div>
                      {item.notes && <div className="item-notes">{item.notes}</div>}
                      <div className="item-meta">
                        <div className="item-contributor">
                          ⬡ {item.contributor}
                          {item.inGameName && (
                            <span style={{ color: 'var(--text-dim)' }}> · IGN: {item.inGameName}</span>
                          )}
                        </div>
                        <div className="item-date">{item.date}</div>
                      </div>
                      {/* Admin delete button on all items */}
                      {user.isAdmin && item.contributorId !== user.id && (
                        <div className="item-admin-delete">
                          <button className="btn btn-small btn-danger" onClick={() => handleDelete(item.id)}>
                            Admin Remove
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── Submit Tab ── */}
          {tab === 'submit' && (
            <div className="fade-in">
              <div className="form-panel" style={{ maxWidth: 760 }}>
                <h2>⬡ Submit Items to Hashira-o7 Bank</h2>
                <p style={{ color: 'var(--text-dim)', fontSize: '0.85rem', marginTop: '-12px', marginBottom: 20 }}>
                  Submitting as <strong style={{ color: 'var(--accent)' }}>{user.displayName || user.username}</strong> (Discord). Add an in-game name below if it's different.
                </p>
                <form onSubmit={handleSubmit}>
                  {batchItems.map((row, index) => (
                    <div key={index} style={{
                      border: '1px solid var(--border-dim)',
                      padding: 20,
                      marginBottom: 16,
                      position: 'relative',
                      background: 'rgba(255,255,255,0.01)'
                    }}>
                      {batchItems.length > 1 && (
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                            Item {index + 1}
                          </span>
                          <button
                            type="button"
                            className="btn btn-small btn-danger"
                            onClick={() => removeBatchRow(index)}
                          >
                            Remove Row
                          </button>
                        </div>
                      )}
                      <div className="form-group">
                        <label>Item Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g., Attrition-4 Laser Repeater"
                          value={row.itemName}
                          onChange={e => updateBatchRow(index, 'itemName', e.target.value)}
                        />
                      </div>
                      <div className="form-row">
                        <div className="form-group">
                          <label>Category</label>
                          <select
                            value={row.category}
                            onChange={e => updateBatchRow(index, 'category', e.target.value)}
                          >
                            {CONFIG.CATEGORIES.map(cat => (
                              <option key={cat} value={cat}>{cat}</option>
                            ))}
                          </select>
                        </div>
                        <div className="form-group">
                          <label>Quantity</label>
                          <input
                            type="number"
                            min="1"
                            required
                            value={row.quantity}
                            onChange={e => updateBatchRow(index, 'quantity', parseInt(e.target.value) || 1)}
                          />
                        </div>
                      </div>
                      <div className="form-group">
                        <label>In-Game Name (optional)</label>
                        <input
                          type="text"
                          placeholder="If different from your Discord name"
                          value={row.inGameName}
                          onChange={e => updateBatchRow(index, 'inGameName', e.target.value)}
                        />
                      </div>
                      <div className="form-group">
                        <label>Notes (optional)</label>
                        <textarea
                          placeholder="Size, location, condition, etc."
                          value={row.notes}
                          onChange={e => updateBatchRow(index, 'notes', e.target.value)}
                        />
                      </div>
                    </div>
                  ))}

                  <div className="form-actions" style={{ justifyContent: 'space-between' }}>
                    <button type="button" className="btn btn-small" onClick={addBatchRow}>
                      + Add Another Item
                    </button>
                    <button type="submit" className="btn" disabled={formStatus === 'submitting'}>
                      {formStatus === 'submitting'
                        ? 'Submitting...'
                        : batchItems.length > 1
                          ? `Submit ${batchItems.length} Items to Bank`
                          : 'Submit to Bank'}
                    </button>
                  </div>
                  {formStatus === 'success' && (
                    <div className="form-success">✓ Submitted successfully</div>
                  )}
                  {formStatus === 'error' && (
                    <div className="form-success" style={{borderColor: 'rgba(248,113,113,0.3)', color: 'var(--danger)', background: 'rgba(248,113,113,0.1)'}}>
                      ✗ Submission failed — check your connection
                    </div>
                  )}
                  {formStatus === 'denied' && (
                    <div className="form-success" style={{borderColor: 'rgba(248,113,113,0.3)', color: 'var(--danger)', background: 'rgba(248,113,113,0.1)'}}>
                      ✗ Access denied — your server role may have changed
                    </div>
                  )}
                  {formStatus === 'ratelimited' && (
                    <div className="form-success" style={{borderColor: 'rgba(251,191,36,0.3)', color: 'var(--warning)', background: 'rgba(251,191,36,0.1)'}}>
                      ⚠ Slow down — too many requests. Try again in a moment.
                    </div>
                  )}
                </form>
              </div>

            </div>
          )}

          {/* ── My Items Tab ── */}
          {tab === 'myitems' && (
            <div className="fade-in">
              <h2 style={{fontFamily: 'var(--font-display)', fontSize: '1rem', fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--accent)', marginBottom: 20}}>
                My Contributions
              </h2>
              {myItems.length === 0 ? (
                <div className="empty-state">
                  <div className="empty-icon">📋</div>
                  <p>You haven't contributed any items yet. Head to the Submit tab to add your first!</p>
                </div>
              ) : (
                <div style={{overflowX: 'auto'}}>
                  <table className="my-items-table">
                    <thead>
                      <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Qty</th>
                        <th>Date</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {myItems.map(item => (
                        <tr key={item.id}>
                          <td style={{fontWeight: 600}}>{item.itemName}</td>
                          <td>
                            <span style={{color: CONFIG.CATEGORY_COLORS[item.category], fontFamily: 'var(--font-mono)', fontSize: '0.75rem'}}>
                              {item.category}
                            </span>
                          </td>
                          <td>{item.quantity}</td>
                          <td style={{color: 'var(--text-dim)', fontFamily: 'var(--font-mono)', fontSize: '0.8rem'}}>{item.date}</td>
                          <td>
                            <button className="btn btn-small btn-danger" onClick={() => handleDelete(item.id)}>
                              Remove
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
